name: arizonix-intelligence

services:
  db:
    image: postgres:17-alpine
    profiles: ["database"]
    environment:
      POSTGRES_DB: "${ARIZONIX_LOCAL_POSTGRES_DB:-arizonix}"
      POSTGRES_PASSWORD: "${ARIZONIX_LOCAL_POSTGRES_PASSWORD:-local-dev-only}"
      POSTGRES_USER: "${ARIZONIX_LOCAL_POSTGRES_USER:-postgres}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${ARIZONIX_LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - arizonix-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      ARIZONIX_ALLOWED_ORIGINS: "${ARIZONIX_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}"
      ARIZONIX_APP_ENVIRONMENT: "${ARIZONIX_APP_ENVIRONMENT:-development}"
      ARIZONIX_APP_VERSION: "${ARIZONIX_APP_VERSION:-0.1.0}"
      ARIZONIX_LOG_LEVEL: "${ARIZONIX_LOG_LEVEL:-info}"
      ARIZONIX_DATABASE_URL: "${ARIZONIX_DATABASE_URL:-}"
      ARIZONIX_DATABASE_DISABLE_STATEMENT_CACHE: "${ARIZONIX_DATABASE_DISABLE_STATEMENT_CACHE:-false}"
      ARIZONIX_SUPABASE_JWT_AUDIENCE: "${ARIZONIX_SUPABASE_JWT_AUDIENCE:-authenticated}"
      ARIZONIX_SUPABASE_URL: "${ARIZONIX_SUPABASE_URL:-}"
    init: true
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    stop_grace_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}"
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:3000}"
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:-}"
    depends_on:
      api:
        condition: service_healthy
    init: true
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    stop_grace_period: 15s

volumes:
  arizonix-postgres:
